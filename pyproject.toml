[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bocadelobo"
version = "1.0.0"
description = "RPA CitizenTech: antecipa bueiros entupidos e dispara alertas antes de chuvas fortes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0", "matplotlib>=3.8"]

[project.scripts]
bocadelobo = "bocadelobo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
